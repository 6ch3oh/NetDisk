name: bingyan-netdisk
services:
  tools:
    image: golang:1.27.0
    pull_policy: never
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    command: [go, test, ./...]
  app:
    image: golang:1.27.0
    pull_policy: never
    container_name: bingyan-netdisk-app
    working_dir: /workspace
    command: [/workspace/bin/netdisk]
    environment:
      NETDISK_ADDR: :8080
      NETDISK_DATA_DIR: /data
      NETDISK_ORIGIN: http://127.0.0.1:38120
      NETDISK_MAX_UPLOAD_BYTES: ${NETDISK_MAX_UPLOAD_BYTES:-104857600}
      NETDISK_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:38120:8080"
    volumes:
      - ./bin:/workspace/bin:ro
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
volumes:
  data:
    name: bingyan-netdisk-data
  gomod:
    name: bingyan-netdisk-gomod
  gocache:
    name: bingyan-netdisk-gocache
